name: Validate and publish website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: prepare
        run: node scripts/prepare.mjs
      - if: steps.prepare.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: treisland/presentation-studio
          ref: ${{ steps.prepare.outputs.source }}
          path: upstream
          persist-credentials: false
      - if: steps.prepare.outputs.build == 'true'
        working-directory: upstream
        run: npm ci
      - if: steps.prepare.outputs.build == 'true'
        working-directory: upstream
        run: npx playwright install --with-deps chromium
      - if: steps.prepare.outputs.build == 'true'
        working-directory: upstream
        run: |
          node scripts/build-companion.mjs --captures ../captures/manifest.json --out test-results/companion-preview/publish
          npm run test:companion -- test-results/companion-preview/publish
      - if: steps.prepare.outputs.build == 'true'
        run: node scripts/publish.mjs
      - if: steps.prepare.outputs.build == 'true'
        run: node scripts/review-public.mjs
      - if: steps.prepare.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: needs.prepare.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
